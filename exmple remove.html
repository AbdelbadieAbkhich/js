<!DOCTYPE html>
<html>
<head>
  <title>Suppression avec removeChild()</title>
</head><body>
<div id="p1">
  <p id="monElement">Texte à supprimer</p>
  <p id="monElement">Texte à supprime r</p>
</div>
<button onclick="supprimer()">Supprimer</button>
<script>
function supprimer() {
  var parent = document.getElementById("p1");
  var enfant = document.getElementById("monElement");
  parent.removeChild(enfant);}
</script></body></html>

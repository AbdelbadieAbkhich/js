<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea id="input" placeholder="Enter something"></textarea>
    <button id="button" onclick="calculer()">Changer</button>
    <input type="text" id="result" placeholder="Result">
    <script>
        function calculer(){
            let input = document.getElementById("input").value;
            let resu= input.trim().split(/\s+/ ).length;
            if (input.trim() === "") {
                resu = 0;
            }
            document.getElementById("result").value = resu;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x;
        do 
        {
            x=parseFloat(prompt("saisire votre note :", "votre note"))

        }while(isNaN(x))
        if(x>=90){
            alert("Exellent")

        }else if (x>=70 ){
            alert("Bien")

        }else{
            alert("Insuffisant")
        }
    </script>
</body>
</html>

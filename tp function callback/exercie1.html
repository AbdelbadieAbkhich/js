        // +++++++++++++++++ Exercice4 : Validation du formulaire :+++++++++++++++++++++++++
        
        function verifNom(x){
            let y=x.length;
            let z=(y>2 && y<25)? true : false;
            return z;
        }
        function verifEMail(x){
            let a= x.includes("@")
            
            return a;
        }
        function verifAge(x){
            let a=Number(x);
            return (a>5 && a<100);

        }
        function valider(){
            let nom=document.getElementById("nom").value;
            let mail=document.getElementById("email").value;
            let age=document.getElementById("age").value;

            if (!verifNom(nom)){
                document.getElementById("nom").style.backgroundColor="yellow";
                let a= document.getElementById("span1");
                a.textContent="*";
                a.style.color="red";
            }else{
